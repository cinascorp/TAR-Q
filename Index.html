<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Real-Time Threat Dashboard</h1>
            <nav class="navbar">
                <button class="filter-btn">Advanced Filtering</button>
            </nav>
        </header>
        <main>
            <section class="dashboard">
                <h2>Signal Analysis</h2>
                <div class="graphs">
                    <div class="graph" id="signalGraph"></div>
                    <div class="graph" id="threatLevelGraph"></div>
                </div>
            </section>
            <section class="threat-level-indicators">
                <h3>Threat Level Indicators</h3>
                <div class="indicator" id="threatIndicator"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

<style>
body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
}
.container {
    padding: 20px;
}
h1, h2, h3 {
    color: #ffffff;
}
.navbar {
    margin-bottom: 20px;
}
.filter-btn {
    background-color: #6200ea;
    color: white;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
}
.graph {
    border: 1px solid #555;
    padding: 10px;
    margin: 10px 0;
}
.indicator {
    background-color: #ff4081;
    padding: 10px;
    border-radius: 5px;
}
</style>
